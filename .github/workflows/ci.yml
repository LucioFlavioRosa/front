# Portão automático do projeto: os mesmos quatro passos que `npm run verificar`
# roda localmente. Nada aqui depende de segredo ou de infraestrutura da Aegea —
# o job sobe do zero em qualquer runner público.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      # @v5 nas duas: as @v4 rodam sobre o runtime node20 dos runners, que o
      # GitHub depreciou — o job ainda passa, com aviso, e para de passar depois.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 22 (LTS). O 20 saiu do suporte em abril de 2026.
          node-version: 22
          cache: npm

      # `npm ci` (e não `install`) para o CI usar exatamente o package-lock.
      - run: npm ci

      # Cada passo isolado: quem lê o log vê qual portão caiu, sem abrir o job.
      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos e build
        run: npm run build

      - name: Testes
        run: npm test
